<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGINT OPS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-left">
            <div class="icon-badge">
                <img src="/images/icons/shield.svg" alt="Shield Icon">
            </div>
        </div>
        <div class="header-center">
            <h1>SIGINT OPS</h1>
        </div>
        <div class="header-right">
            <div class="secure-badge">
                <span class="pulse-dot"></span>
                <span>SECURE &bull; ONLINE</span>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="dashboard-container">

        <!-- MAIN RADAR & STATS SECTION -->
        <section class="radar-section">
            <!-- עטיפה שמאל: הסורק (רדאר) -->
            <div class="radar-wrapper">
                <div class="radar-container">
                    <div class="radar-sweep"></div>

                    <!-- הנקודות הצהובות/ירוקות ברדאר -->
                    <div class="radar-blip blip-1"></div>
                    <div class="radar-blip blip-2"></div>
                    <div class="radar-blip blip-3"></div>
                </div>
            </div>

            <!-- עטיפה ימין: הנתונים והמספרים -->
            <div class="stats-wrapper">
                <div class="stat-box">
                    <span class="stat-number">24</span>
                    <span class="stat-label">ACTIVE SIGNALS</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">07</span>
                    <span class="stat-label">PRIORITY ALERTS</span>
                </div>
            </div>
        </section>

        <!-- ACTION BUTTONS BAR -->
        <section class="actions-bar">
            <button class="action-btn">
                <img src="/images/icons/zap.svg" alt="New Brief">
                <span>New Brief</span>
            </button>
            <button class="action-btn">
                <img src="/images/icons/code.svg" alt="Decode">
                <span>Decode</span>
            </button>
            <button class="action-btn">
                <img src="/images/icons/rocket.svg" alt="Request Drone">
                <span>Request Drone</span>
            </button>
        </section>

        <!-- INTEL CARDS GRID -->
        <section class="cards-grid">
            <!-- Card 1 - Critical -->
            <div class="intel-card critical-card">
                <div class="card-header">
                    <span class="badge critical">CRITICAL</span>
                    <span class="status-text">In Progress</span>
                </div>
                <div class="card-body">
                    <h3>Operation Nightfall</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-track">
                            <div class="progress-fill" style="width: 65%;"></div>
                        </div>
                        <span class="progress-percent">65%</span>
                    </div>
                </div>
            </div>

            <!-- Card 2 - High -->
            <div class="intel-card high-card">
                <div class="card-header">
                    <span class="badge high">HIGH</span>
                    <span class="status-text">Analyzing</span>
                </div>
                <div class="card-body">
                    <h3>Signal Intercept Alpha</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-track">
                            <div class="progress-fill" style="width: 40%;"></div>
                        </div>
                        <span class="progress-percent">40%</span>
                    </div>
                </div>
            </div>

            <!-- Card 3 - Medium -->
            <div class="intel-card medium-card">
                <div class="card-header">
                    <span class="badge medium">MEDIUM</span>
                    <span class="status-text">Pending</span>
                </div>
                <div class="card-body">
                    <h3>Asset Recovery</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-track">
                            <div class="progress-fill" style="width: 15%;"></div>
                        </div>
                        <span class="progress-percent">15%</span>
                    </div>
                </div>
            </div>

            <!-- Card 4 - High -->
            <div class="intel-card high-card">
                <div class="card-header">
                    <span class="badge high">HIGH</span>
                    <span class="status-text">Active</span>
                </div>
                <div class="card-body">
                    <h3>Cyber Defense Grid</h3>
                    <div class="progress-bar-wrapper">
                        <div class="progress-track">
                            <div class="progress-fill" style="width: 80%;"></div>
                        </div>
                        <span class="progress-percent">80%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- THREAT STATUS BAR -->
        <section class="threat-status-bar">
            <span class="threat-dot"></span>
            <span class="threat-text">THREAT DETECTED</span>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <img src="/images/icons/dashboard.svg" alt="Dashboard">
            <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item">
            <img src="/images/icons/feed.svg" alt="Feed">
            <span>Feed</span>
        </a>
        <a href="#" class="nav-item">
            <img src="/images/icons/brief.svg" alt="Brief">
            <span>Brief</span>
        </a>
    </nav>
    <button class="help-btn" aria-label="Help">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="18" height="18" fill="currentColor">
            <path
                d="M224 224C224 171 267 128 320 128C373 128 416 171 416 224C416 266.7 388.1 302.9 349.5 315.4C321.1 324.6 288 350.7 288 392L288 416C288 433.7 302.3 448 320 448C337.7 448 352 433.7 352 416L352 392C352 390.3 352.6 387.9 355.5 384.7C358.5 381.4 363.4 378.2 369.2 376.3C433.5 355.6 480 295.3 480 224C480 135.6 408.4 64 320 64C231.6 64 160 135.6 160 224C160 241.7 174.3 256 192 256C209.7 256 224 241.7 224 224zM320 576C342.1 576 360 558.1 360 536C360 513.9 342.1 496 320 496C297.9 496 280 513.9 280 536C280 558.1 297.9 576 320 576z" />
        </svg>
    </button>
</body>

</html>
